# Nginx server configuration for Verism AI Single Page Application (SPA)

# Configure the main HTTP server block
server {
    # Listen on TCP port 3000 for incoming HTTP requests
    listen 3000;
    # Listen on IPv6 localhost address on port 3000
    listen [::]:3000;
    # Accept any incoming host header
    server_name localhost;

    # Set root filesystem directory where compiled web assets are located
    root /usr/share/nginx/html;
    # Set default index document filenames in priority order
    index index.html index.htm;

    # Enable Gzip text compression for faster asset delivery
    gzip on;
    # Set minimum response byte size to trigger Gzip compression
    gzip_min_length 1000;
    # Specify MIME types eligible for automatic Gzip compression
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security header preventing clickjacking iframe embeddings
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Security header preventing MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Security header enforcing strict cross-origin referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy backend API endpoints to FastAPI container
    location /api/ {
        # Forward API traffic to internal Docker DNS alias for backend service
        proxy_pass http://backend_api:8000;
        # Preserve original host header in upstream request
        proxy_set_header Host $host;
        # Forward client IP address
        proxy_set_header X-Real-IP $remote_addr;
        # Append client IP to forwarded-for chain
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward original request scheme (http or https)
        proxy_set_header X-Forwarded-Proto $scheme;
        # Set backend read timeout to 300 seconds for long-running AI batch grading
        proxy_read_timeout 300s;
        # Set backend connect timeout to 10 seconds
        proxy_connect_timeout 10s;
    }

    # Cache immutable static assets (JavaScript, CSS, fonts, images) for 1 year
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        # Set browser cache expiration to 1 year
        expires 1y;
        # Set cache-control header allowing public CDN caching
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Fall back to root index.html if file is missing
        try_files $uri =404;
    }

    # Route all other client requests to index.html for TanStack Router SPA navigation
    location / {
        # Check if requested URI or directory exists, otherwise fallback to /index.html
        try_files $uri $uri/ /index.html;
    }
}

